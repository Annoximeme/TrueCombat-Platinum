// TrueCombat: Platinum community server
set sv_hostname "My TrueCombat: Platinum server"
set sv_maxclients 16
set rconpassword ""          // set one to use remote admin; empty = rcon off
set sv_pure 0                // file checks are done by the built-in anti-cheat instead

// Mode: 1 Elimination, 2 Team Elimination, 3 Capture Point, 4 Team Deathmatch, 5 Flag Capture
set tcp_native_rounds 2
set tcp_roundtime 300        // seconds per round
set g_roundlimit 10          // rounds per map
set sv_mapRotationTime 20    // minutes per map
set sv_mapRotation "obj_village obj_railhouse obj_snow obj_delta obj_northport obj_stadtrand"

// Network: 40 updates a second, lag compensation on, drop dead connections after 20 s
set sv_fps 40
set g_antilag 1
set sv_timeout 20

// Bots fill empty slots until real players join (0 = no bots)
set bot_minplayers 0
set bot_skill 3

map obj_village
