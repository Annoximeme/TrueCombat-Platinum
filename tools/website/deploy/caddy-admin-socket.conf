# /etc/systemd/system/caddy.service.d/admin-socket.conf on the VPS (full audit 2026-11-13).
# Creates /run/caddy (mode 0750, owned by the caddy user) for the admin socket set in Caddyfile.live.
# Changing the admin address needs `systemctl restart caddy` once; after that `systemctl reload caddy` works.
[Service]
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
