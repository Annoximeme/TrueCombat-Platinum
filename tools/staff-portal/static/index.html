<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Staff Portal · TrueCombat: Platinum</title>
<link rel="icon" href="/static/favicon.png">
<link rel="preload" href="/static/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<div id="signin" class="signin" hidden>
  <div class="signin-card">
    <img src="/static/favicon.png" alt="" class="signin-logo" width="56" height="56">
    <p class="eyebrow">TrueCombat: Platinum</p>
    <h1>Staff Portal</h1>
    <p class="muted">Restricted to server staff. Sign in with the Discord account that holds your staff role.</p>
    <p id="signin-msg" class="signin-msg" hidden></p>
    <a class="btn btn-primary btn-wide" href="/auth/login">Sign in with Discord</a>
    <div id="dev-login" class="dev-login" hidden>
      <span class="muted">Local test sign-in:</span>
      <a href="/auth/dev?role=moderator">Moderator</a>
      <a href="/auth/dev?role=admin">Admin</a>
      <a href="/auth/dev?role=owner">Owner</a>
    </div>
  </div>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <a class="brand" href="#/servers">
      <img src="/static/favicon.png" alt="" width="28" height="28">
      <span><b>STAFF</b> PORTAL</span>
    </a>
    <nav id="nav">
      <a href="#/servers" data-page="servers">Servers</a>
      <a href="#/chat" data-page="chat">Live chat</a>
      <a href="#/reports" data-page="reports">Reports <span class="count" id="nav-reports" hidden></span></a>
      <a href="#/players" data-page="players">Players</a>
      <a href="#/bans" data-page="bans">Bans</a>
      <a href="#/audit" data-page="audit" data-perm="audit">Audit log</a>
      <a href="#/staff" data-page="staff" data-perm="staff.manage">Staff</a>
      <a href="#/health" data-page="health" data-perm="health">Health</a>
    </nav>
    <div class="me">
      <img id="me-avatar" alt="" width="32" height="32" hidden>
      <div><b id="me-name"></b><span id="me-role" class="role"></span></div>
      <button id="logout" class="link" type="button">Sign out</button>
    </div>
  </aside>
  <main id="main" class="main" tabindex="-1"></main>
</div>

<div id="modal" class="modal" hidden>
  <form id="modal-form" class="modal-card" novalidate>
    <h2 id="modal-title"></h2>
    <p id="modal-sub" class="muted"></p>
    <div id="modal-body"></div>
    <p id="modal-error" class="error" hidden></p>
    <div class="modal-actions">
      <button type="button" class="btn" id="modal-cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" id="modal-ok">Confirm</button>
    </div>
  </form>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
