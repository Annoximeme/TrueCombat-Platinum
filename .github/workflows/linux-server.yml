name: Linux server

# Builds the native Linux dedicated server from the source snapshot attached to
# each release and adds it to that release as a ready-to-run server kit
# (TrueCombat-Platinum-Linux-Server.tar.gz plus its .sha256). Community hosts
# and our own servers (tools/linux-server/update-server.sh) install from it.
# Releases whose source predates Linux support are skipped.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build for"
        required: true

permissions:
  contents: write

concurrency:
  group: linux-server-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    # 22.04 keeps the binaries compatible with glibc 2.35 and newer.
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install build tools
        run: sudo apt-get update -q && sudo apt-get install -yq ninja-build clang
      - name: Fetch release source
        id: source
        run: |
          mkdir -p dl src
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'f__source__*.zip' --dir dl
          unzip -q dl/*.zip -d src
          if [ -f src/game_src/native/tcp_posix.h ]; then
            echo "linux=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG source has no Linux support yet, nothing to build."
            echo "linux=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Build server
        if: steps.source.outputs.linux == '1'
        run: tools/linux-server/build-linux-server.sh src out
      - name: Smoke test
        if: steps.source.outputs.linux == '1'
        run: |
          ldd out/server/platinum-server.x86_64
          # No game data here, so it stops after start-up: just check it got that far.
          timeout 10 out/server/platinum-server.x86_64 +set dedicated 1 +set fs_basepath "$PWD/out" +quit > smoke.log 2>&1 || true
          grep -q "linux-x86_64" smoke.log
          python3 - out/tcetest/qagame.mp.x86_64.so <<'PY'
          import ctypes, sys
          lib = ctypes.CDLL(sys.argv[1])
          assert lib.vmMain and lib.dllEntry, "game module exports missing"
          print("game module loads")
          PY
      - name: Package kit
        if: steps.source.outputs.linux == '1'
        run: |
          mkdir -p dist/linux-server
          cp -r tools/linux-server/kit/. dist/linux-server/
          cp -r out/server out/tcetest dist/linux-server/
          cp tools/linux-server/update-server.sh dist/linux-server/
          echo "$TAG" > dist/linux-server/RELEASE
          cd dist
          tar -czf TrueCombat-Platinum-Linux-Server.tar.gz --owner=0 --group=0 linux-server
          sha256sum TrueCombat-Platinum-Linux-Server.tar.gz > TrueCombat-Platinum-Linux-Server.tar.gz.sha256
          cat TrueCombat-Platinum-Linux-Server.tar.gz.sha256
      - name: Attach to release
        if: steps.source.outputs.linux == '1'
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/TrueCombat-Platinum-Linux-Server.tar.gz \
            dist/TrueCombat-Platinum-Linux-Server.tar.gz.sha256
