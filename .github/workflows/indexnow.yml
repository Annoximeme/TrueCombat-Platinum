name: Search engine ping

# When site pages change on main, tells the IndexNow search engines (Bing, Yandex and others)
# which pages to re-crawl. Changes made by the Website workflow are announced by that workflow.
on:
  push:
    branches: [main]
    paths: ["docs/**.html", "docs/sitemap.xml"]
  workflow_dispatch:

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for the web server to pick up the change
        run: sleep 180
      - name: Send changed pages
        run: python tools/website/indexnow.py
