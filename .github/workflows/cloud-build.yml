name: Cloud build

# Builds and tests the game on GitHub instead of the development PC:
#   windows  full Windows x64 cross-build (client, DX12 + OpenGL renderers, UI, game
#            modules, launcher, installer, master) plus the native probes under Wine
#   linux    Linux dedicated server (public kit build)
#   eac      Linux dedicated server with Easy Anti-Cheat (for the official servers)
#   bots     headless bots-only soak of the Linux build on a few maps, with server CPU per map
#   scan     provenance / tool metadata scan of the source tree (images, paks, embedded image arrays)
#
# Sources: a published release's source snapshot, or a request sent with
# tools/ci/request.py (the changed files of a candidate tree, kept in a hidden draft
# release ci-<name>). Results of a request go back into that draft, never into
# workflow artifacts: those, like the logs, are public in a public repository.
# Nothing here publishes, uploads to a public release, or touches the VPS.
on:
  repository_dispatch:
    types: [cloud-build]
  workflow_dispatch:
    inputs:
      request:
        description: "Request draft (ci-<name>); leave empty to build a published release"
        required: false
        default: ""
      tag:
        description: "Published release to build when there is no request (empty = latest)"
        required: false
        default: ""
      jobs:
        description: "Jobs when there is no request"
        required: false
        default: "scan,windows,linux,eac,bots"
  pull_request:
    paths:
      - "tools/ci/**"
      - "tools/linux-server/**"
      - ".github/workflows/cloud-build.yml"

permissions:
  contents: write

concurrency:
  group: cloud-build-${{ github.event.client_payload.request || inputs.request || inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  LLVM_MINGW_VERSION: "20261020"
  STREAMLINE_VERSION: "2.14.16"
  STREAMLINE_SHA256: "32041e51db0cab709a271b72a352281b690c2abbd669a827809401a5dd23956b"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      request: ${{ steps.p.outputs.request }}
      base: ${{ steps.p.outputs.base }}
      jobs: ${{ steps.p.outputs.jobs }}
      maps: ${{ steps.p.outputs.maps }}
      minutes: ${{ steps.p.outputs.minutes }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          REQUEST: ${{ github.event.client_payload.request || inputs.request }}
          TAG: ${{ inputs.tag }}
          JOBS: ${{ inputs.jobs }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "$REQUEST" ]; then
            [[ "$REQUEST" =~ ^ci-[A-Za-z0-9._-]+$ ]] || { echo "::error::bad request name"; exit 1; }
            python3 tools/ci/draft.py get "$REQUEST" request.json request.json
            python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, re
          r = json.load(open('request.json'))
          assert re.fullmatch(r'v[0-9A-Za-z._-]+', r['base'])
          jobs = [j for j in r['jobs'] if j in ('scan', 'windows', 'linux', 'eac', 'bots')]
          maps = ' '.join(m for m in r.get('maps', []) if re.fullmatch(r'[A-Za-z0-9_]+', m))
          print('base=' + r['base']); print('jobs=' + ','.join(jobs))
          print('maps=' + (maps or 'obj_village obj_snow')); print('minutes=' + str(min(int(r.get('minutes', 4)), 20)))
          PY
            echo "request=$REQUEST" >> "$GITHUB_OUTPUT"
          else
            base=${TAG:-$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)}
            [[ "$base" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "::error::bad tag"; exit 1; }
            jobs=${JOBS:-scan,windows,linux,eac,bots}
            minutes=4; [ "$EVENT" = pull_request ] && minutes=2
            { echo "request="; echo "base=$base"; echo "jobs=$jobs"; echo "maps=obj_village obj_snow"; echo "minutes=$minutes"; } >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  scan:
    # Release-speed plan (2026-11-17): metadata problems are found when a kit is sent, not during packaging.
    needs: plan
    if: contains(needs.plan.outputs.jobs, 'scan')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REQUEST: ${{ needs.plan.outputs.request }}
      BASE: ${{ needs.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v4
      - name: Source
        run: tools/ci/compose-source.sh "$BASE" src "$REQUEST"
      - name: Metadata scan
        id: scan
        run: |
          if [ -n "$REQUEST" ]; then   # a candidate or kit: hits fail the job; file names stay in the private draft
            python3 tools/ci/scan_metadata.py --quiet --json scan.json src
          else                         # an already published release: report only (0.37.3 and older carry known hits)
            python3 tools/ci/scan_metadata.py --json scan.json src || echo "::warning::published release $BASE has metadata hits (see log)"
          fi
      - name: Results to the request draft
        if: always() && env.REQUEST != ''
        env:
          RESULT: ${{ job.status }}
        run: |
          python3 - > scan-summary.md <<'PY'
          import json, os
          d = json.load(open('scan.json')) if os.path.exists('scan.json') else {'files': 0, 'hits': []}
          print(f"Metadata scan: {d['files']} files, {len(d['hits'])} hits")
          for h in d['hits']: print(f"- {h['file']}: {', '.join(h['flags'])}")
          PY
          python3 tools/ci/draft.py put "$REQUEST" scan-summary.md
          python3 tools/ci/result.py scan "$RESULT" scan-summary.md > scan-result.json
          python3 tools/ci/draft.py put "$REQUEST" scan-result.json

  windows:
    needs: plan
    if: contains(needs.plan.outputs.jobs, 'windows')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REQUEST: ${{ needs.plan.outputs.request }}
      BASE: ${{ needs.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: win-toolchain-${{ env.LLVM_MINGW_VERSION }}-sl${{ env.STREAMLINE_VERSION }}
      - name: Toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/ci/setup-toolchain.sh ~/toolchain
      - name: Wine (runs the native probes)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends wine wine64 > /dev/null
          command -v wine || { [ -x /usr/lib/wine/wine64 ] && sudo ln -s /usr/lib/wine/wine64 /usr/local/bin/wine; }
          wine --version
      - name: Source
        run: tools/ci/compose-source.sh "$BASE" src "$REQUEST"
      - name: Private SDK headers
        run: |
          if python3 tools/ci/draft.py get ci-deps eos-sdk-include.zip eos.zip 2>/dev/null; then
            unzip -q eos.zip -d eos && echo "EOS_INCLUDE=$PWD/eos/Include" >> "$GITHUB_ENV"
          else
            echo "::notice::EOS SDK headers not available (draft ci-deps); building without Easy Anti-Cheat."
          fi
      - name: Build
        run: |
          export LLVM_MINGW=~/toolchain/llvm-mingw SL_SDK=~/toolchain/streamline
          [ -n "$REQUEST" ] && export QUIET=1   # candidate error output goes to the private draft only
          tools/ci/build-windows.sh src out
      - name: Metadata scan of the built game
        run: |
          if [ -n "$REQUEST" ]; then python3 tools/ci/scan_metadata.py --quiet out/game
          else python3 tools/ci/scan_metadata.py out/game || echo "::warning::published release $BASE has metadata hits"; fi
      - name: Summary
        if: always()
        run: '[ -f out/summary.md ] && { echo "## Windows build ($BASE${REQUEST:+ + $REQUEST})"; cat out/summary.md; } >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Results to the request draft
        if: always() && env.REQUEST != ''
        env:
          RESULT: ${{ job.status }}
        run: |
          [ -d out ] || mkdir out
          (cd out && zip -qr ../windows-build.zip game probes logs summary.md options.txt SHA256SUMS.txt TrueCombat-Platinum-Setup-uncompressed.exe platinum-master.exe 2>/dev/null || true)
          [ -f windows-build.zip ] && python3 tools/ci/draft.py put "$REQUEST" windows-build.zip
          python3 tools/ci/result.py windows "$RESULT" out/summary.md > windows-result.json
          python3 tools/ci/draft.py put "$REQUEST" windows-result.json

  linux:
    needs: plan
    if: contains(needs.plan.outputs.jobs, 'linux') || contains(needs.plan.outputs.jobs, 'bots') || contains(needs.plan.outputs.jobs, 'eac')
    runs-on: ubuntu-22.04   # glibc 2.35, like the public server kit
    timeout-minutes: 120
    env:
      REQUEST: ${{ needs.plan.outputs.request }}
      BASE: ${{ needs.plan.outputs.base }}
      JOBS: ${{ needs.plan.outputs.jobs }}
      MAPS: ${{ needs.plan.outputs.maps }}
      MINUTES: ${{ needs.plan.outputs.minutes }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -yq ninja-build clang > /dev/null
      - name: Source
        run: tools/ci/compose-source.sh "$BASE" src "$REQUEST"
      - name: Linux server
        id: linux
        run: tools/linux-server/build-linux-server.sh src linux > linux-build.log 2>&1 || { [ -z "$REQUEST" ] && tail -60 linux-build.log; exit 1; }
      - name: Linux server with Easy Anti-Cheat
        id: eac
        if: contains(env.JOBS, 'eac')
        run: |
          if ! python3 tools/ci/draft.py get ci-deps eos-sdk-include.zip eos.zip 2>/dev/null; then
            echo "::warning::EOS SDK headers not available (draft ci-deps); EAC server not built."
            echo "built=no (EOS SDK headers missing from draft ci-deps)" >> "$GITHUB_OUTPUT"; exit 0
          fi
          unzip -q eos.zip -d eos
          EOS_SDK_DIR=$PWD/eos tools/linux-server/build-linux-server.sh src linux-eac > eac-build.log 2>&1 || { [ -z "$REQUEST" ] && tail -60 eac-build.log; exit 1; }
          strings linux-eac/server/platinum-server.x86_64 | grep -q -i eos_ || { echo "::error::EAC server has no EOS code"; exit 1; }
          echo "built=yes" >> "$GITHUB_OUTPUT"
      - name: Game data cache
        if: contains(env.JOBS, 'bots')
        uses: actions/cache@v4
        with:
          path: soak-data
          key: soak-data-${{ env.BASE }}
      - name: Bots soak
        id: bots
        if: contains(env.JOBS, 'bots')
        run: tools/ci/bots-soak.sh linux "$BASE" "$MAPS" "$MINUTES"
      - name: Summary
        if: always()
        run: |
          { echo "## Linux server ($BASE${REQUEST:+ + $REQUEST})"
            echo "- Linux server: ${{ steps.linux.outcome }}"
            echo "- EAC server: ${{ steps.eac.outcome }} ${{ steps.eac.outputs.built }}"
            echo "- Bots soak ($MINUTES min per map): ${{ steps.bots.outcome }}"
            if [ -f soak-logs/summary.md ]; then echo; cat soak-logs/summary.md; fi
            for d in linux linux-eac; do
              if [ -d $d ]; then echo; echo "$d:"; (cd $d && sha256sum server/* tcetest/*) | sed 's/^/    /'; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Results to the request draft
        if: always() && env.REQUEST != ''
        run: |
          for j in linux eac bots; do
            case $j in linux) o="${{ steps.linux.outcome }}";; eac) o="${{ steps.eac.outcome }}";; bots) o="${{ steps.bots.outcome }}";; esac
            case ",$JOBS," in *",$j,"*) ;; *) continue;; esac
            [ "$o" = success ] && r=success || r=failure
            note=soak-logs/summary.md; [ $j = bots ] || note=/dev/null
            python3 tools/ci/result.py $j $r $note > $j-result.json
          done
          tar -czf linux-build.tar.gz --ignore-failed-read linux linux-eac soak-logs *.log 2>/dev/null || true
          python3 tools/ci/draft.py put "$REQUEST" linux-build.tar.gz
          for f in *-result.json; do python3 tools/ci/draft.py put "$REQUEST" "$f"; done
