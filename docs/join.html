<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a server · TrueCombat: Platinum</title>
<meta name="robots" content="noindex">
<meta name="description" content="Opens TrueCombat: Platinum and joins the server straight away.">
<link rel="icon" type="image/png" href="/img/favicon.png">
<style>
:root { color-scheme: dark; }
@font-face { font-family: "IBM Plex Sans"; font-weight: 400 600; font-display: swap; src: url("/fonts/ibm-plex-sans-latin.woff2") format("woff2"); }
@font-face { font-family: "Saira Condensed"; font-weight: 700; font-display: swap; src: url("/fonts/saira-condensed-700-latin.woff2") format("woff2"); }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d1016 url("/img/map-snow-640.webp") center / cover; color: #e8eaef; font: 16px/1.6 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
body::before { content: ""; position: fixed; inset: 0; background: rgba(13,16,22,.88); }
main { position: relative; width: min(520px, calc(100vw - 32px)); padding: 28px 0; display: grid; gap: 16px; text-align: center; justify-items: center; }
img.logo { width: min(260px, 60vw); height: auto; }
.card { width: 100%; box-sizing: border-box; padding: 20px; border: 1px solid #2a3140; border-radius: 10px; background: rgba(20,24,32,.82); display: grid; gap: 6px; }
.eyebrow { font: 600 .78rem/1 "Saira Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .18em; color: #ef5050; }
h1 { margin: 0; font: 700 1.9rem/1.1 "Saira Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .03em; overflow-wrap: anywhere; }
.meta { color: #9aa3b3; font-size: .95rem; }
.team { display: inline-block; margin-top: 4px; padding: 4px 10px; border-radius: 4px; font-weight: 600; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; }
.team.r { background: rgba(214,59,59,.18); color: #ff8a8a; }
.team.b { background: rgba(91,155,213,.18); color: #9cc6ee; }
a.play { display: inline-flex; justify-content: center; padding: 14px 26px; border-radius: 6px; background: linear-gradient(180deg, #ef5050, #d63b3b); color: #fff; text-decoration: none; font: 700 1.2rem/1 "Saira Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .08em; box-shadow: 0 8px 28px -10px rgba(214,59,59,.7); }
p { margin: 0; color: #9aa3b3; }
p.small { font-size: .88rem; }
code { padding: 2px 6px; border-radius: 4px; background: #1b212c; color: #e8eaef; }
button.copy { font: inherit; color: #c9ced8; background: none; border: 1px solid #2a3140; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
button.copy:hover { border-color: #9aa3b3; }
nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; }
nav a { color: #c9ced8; text-decoration: none; font-size: .95rem; padding: 8px 2px; border-bottom: 1px solid transparent; }
nav a:hover, nav a:focus-visible { color: #fff; border-bottom-color: #d63b3b; }
.hidden { display: none; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/img/logo.webp" width="900" height="512" alt="TrueCombat: Platinum">
  <div class="card" id="card">
    <span class="eyebrow" data-t="eyebrow">Join a server</span>
    <h1 id="name">Loading</h1>
    <span class="meta" id="meta"></span>
    <span class="team hidden" id="team"></span>
  </div>
  <a class="play" id="play" href="#" data-t="play">Open the game</a>
  <p id="hint" data-t="hint">The game starts and joins the server. Your browser may ask whether to open TrueCombat: Platinum first.</p>
  <p class="small" id="manual"></p>
  <button type="button" class="copy hidden" id="copy" data-t="copy">Copy address</button>
  <p class="small" data-t="install">Not installed yet? <a href="/#download">Download TrueCombat: Platinum</a>. One-click join needs launcher 1.5.0 or newer.</p>
  <nav aria-label="More"><a href="/servers.html" data-t="servers">All servers</a><a href="https://discord.gg/8kcHdg2Hch">Discord</a></nav>
</main>
<script>
(function () {
  var nl = /^nl\b/i.test(navigator.language || '');
  var T = nl ? {
    eyebrow: 'Server joinen', play: 'Open de game', copy: 'Adres kopiëren', copied: 'Gekopieerd', servers: 'Alle servers',
    hint: 'De game start en verbindt meteen met de server. Je browser vraagt misschien eerst of TrueCombat: Platinum mag openen.',
    install: 'Nog niet geïnstalleerd? <a href="/#download">Download TrueCombat: Platinum</a>. Joinen met één klik vraagt launcher 1.5.0 of nieuwer.',
    manual: 'Lukt het niet? Plak <code>%a</code> in het adresvak van de launcher%p en druk op <b>PLAY</b>.', pw: ' (wachtwoord <code>%w</code>)',
    bad: 'Deze link is niet compleet', badMeta: 'Vraag een nieuwe link of kies een server in de lijst.', players: 'spelers', offline: 'Server antwoordt nu niet',
    team: { r: 'Jouw team: Terrorists', b: 'Jouw team: Special Ops' }
  } : {
    copied: 'Copied', manual: 'Nothing happened? Paste <code>%a</code> into the launcher\'s address box%p and press <b>PLAY</b>.',
    pw: ' (password <code>%w</code>)', bad: 'This link is incomplete', badMeta: 'Ask for a new link or pick a server from the list.',
    players: 'players', offline: 'The server is not answering right now',
    team: { r: 'Your team: Terrorists', b: 'Your team: Special Ops' }
  };
  if (nl) {
    document.documentElement.lang = 'nl';
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) {
      var k = el.getAttribute('data-t'); if (T[k]) el.innerHTML = T[k];
    });
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  // #host:port?pw=secret&team=r
  var raw = decodeURIComponent((location.hash || '').slice(1));
  var q = raw.indexOf('?'), addr = q < 0 ? raw : raw.slice(0, q), args = {};
  (q < 0 ? '' : raw.slice(q + 1)).split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) args[kv.slice(0, i)] = kv.slice(i + 1); });
  var okAddr = /^[A-Za-z0-9.-]{1,200}(:\d{1,5})?$/.test(addr);
  var pw = /^[A-Za-z0-9_-]{1,32}$/.test(args.pw || '') ? args.pw : '';
  var team = args.team === 'r' || args.team === 'b' ? args.team : '';
  var $ = function (id) { return document.getElementById(id); };
  if (!okAddr) {
    $('name').textContent = T.bad; $('meta').textContent = T.badMeta;
    $('play').classList.add('hidden'); $('hint').classList.add('hidden');
    return;
  }
  var link = 'truecombat://join/' + addr + (pw || team ? '?' + [pw ? 'pw=' + pw : '', team ? 'team=' + team : ''].filter(Boolean).join('&') : '');
  $('play').href = link;
  $('name').textContent = addr;
  if (team) { $('team').textContent = T.team[team]; $('team').className = 'team ' + team; }
  $('manual').innerHTML = T.manual.replace('%a', esc(addr)).replace('%p', pw ? T.pw.replace('%w', esc(pw)) : '');
  var copy = $('copy'); copy.classList.remove('hidden');
  copy.addEventListener('click', function () {
    if (navigator.clipboard) navigator.clipboard.writeText(addr).then(function () { copy.textContent = T.copied || 'Copied'; });
  });
  // Server name and players from the live list (official and listed community servers)
  fetch('https://api.truecombat.eu/servers.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    var all = (d.servers || []).concat(d.official || []);
    var host = addr.toLowerCase().replace(/^truecombat\.eu:/, '2.24.59.195:');
    var s = all.filter(function (x) { return (x.address || '').toLowerCase() === host || (x.address || '').toLowerCase() === addr.toLowerCase(); })[0];
    if (!s) return;
    $('name').textContent = (s.name || addr).replace(/\^./g, '');
    var humans = s.humans != null ? s.humans : s.players;
    $('meta').textContent = [s.map ? s.map.replace(/^obj_/, '').replace(/^./, function (c) { return c.toUpperCase(); }) : '',
      humans != null && s.maxPlayers ? humans + ' / ' + s.maxPlayers + ' ' + T.players : ''].filter(Boolean).join(' · ');
  }).catch(function () {});
  // Hand the link to the game right away; the button stays for browsers that need a click
  setTimeout(function () { location.href = link; }, 400);
})();
</script>
</body>
</html>
